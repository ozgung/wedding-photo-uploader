# Template: install-web.sh replaces __DOMAIN__ and installs this inside nginx's http context, alongside existing sites.
# Generate /etc/nginx/snippets/wedding-cloudflare.conf with cloudflare_ips.py first.
limit_req_zone $binary_remote_addr zone=wedding_requests:2m rate=25r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    # Certificate is issued by the webroot installer; use Cloudflare Full (strict).
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/wedding-cloudflare.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    client_max_body_size 4m;
    client_body_timeout 100s;
    access_log off;
    error_log /var/log/nginx/wedding-error.log warn;
    add_header Strict-Transport-Security "max-age=2592000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wedding-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # A venue can have hundreds of guests sharing one IP; do not use a low per-IP cap.
        limit_req zone=wedding_requests burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite, rather than append untrusted client forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 110s;
        proxy_send_timeout 110s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wedding-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
